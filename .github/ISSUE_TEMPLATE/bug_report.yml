name: Bug report
description: Something looks or works wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. For security problems, please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Screenshots help a lot for visual bugs.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /edit\n2. ..."
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen
      options: [posy.page, Self-hosted (Docker), Self-hosted (Vercel), Self-hosted (from source), Other]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Posy version, description: From package.json or the footer, placeholder: "2.0.0" }
  - type: input
    id: env
    attributes: { label: Browser and OS, placeholder: "Safari 19 on iOS" }
  - type: input
    id: look
    attributes: { label: Look and palette, description: If it is visual, placeholder: "Washi, Indigo" }
